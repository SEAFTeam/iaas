entities:
  seaf.ta.reverse.general.obss:
    presentations:
      table_view:
        type: table
        headers:
          - value: name
            text: Название бакета
            sortable: true
            align: left
            link: link
            width: 20%
          - value: system
            text: Система
            align: left
            link: system_link
            width: 20%
          - value: type
            text: Тип
            width: 20%
          - value: created
            text: Дата создания
            width: 20%
          - value: storage_class
            text: Класс хранилища
            width: 20%
          - value: bucket_location
            text: Зона доступности
            width: 20%
          - value: storage_size
            text: Объем хранилища, ГБ
            width: 20%
          - value: object_count
            text: Количество объектов
            width: 20%
          - value: dc
            text: Датацентр
            width: 20%
          - value: quota
            text: Квота
            width: 20%
          - value: versioning
            text: Версионирование
            width: 20%
          - value: tags
            text: Теги
            align: left
            width: 20%
        origin:
          servers2systems: seaf.ta.reverse.general.servers2systems
          manifest: ($)
        source: >
          (
              $ctx := $params;
              $servers2systems := servers2systems;
              $domain_matcher := $eval('/^' & $ctx.domain & '.*/');
              $cobss := manifest."seaf.ta.reverse.general.obss" ~> $each(function($v, $k){$domain_matcher($k) ? {$k:$v}});
              $cdcs := manifest."seaf.ta.services.dc" ~> $each(function($v, $k){$domain_matcher($k) ? {$k:$v}});
              [$cobss.$spread().(
                  $id := $keys()[0];
                  $systems := $lookup($servers2systems, $id);
                  $tags := $join($.*.tags.($key := $keys(); $key & ": " & $.*), "\n");
                  $dms_dc := $.*.DC;
                  $dc := $cdcs.$spread()[$keys()[0] = $dms_dc].*.title;
                  {
                      'name': $.*.title,
                      'type': $.*.type,
                      'created': $.*.created,
                      'storage_class': $.*.storage_class,
                      'bucket_location': $.*.bucket_location,
                      'storage_size': $.*.storage_size / (1024 * 1024 * 1024) ~> $floor() ~> $string(),
                      'object_count': $.*.object_count,
                      'quota': $.*.quota / (1024 * 1024 * 1024) ~> $string(),
                      'versioning': $.*.versioning,
                      'dc': $dc,
                      'link': '/entities/seaf.ta.reverse.general.obss/table_view?domain=' & $ctx.domain,
                      'system': $systems[0].title,
                      'system_link': $systems[0].link,
                      'tags': $tags
                  }
              )]
          )